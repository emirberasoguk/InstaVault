[project]
name = "instavault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "emirberasoguk", email = "190600292+emirberasoguk@users.noreply.github.com" }
]
requires-python = ">=3.13"
